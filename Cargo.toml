[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
version = "0.1.0"
authors = ["OpenFX contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"

[workspace.dependencies]
blake3 = "1.8.3"
syn = { version = "2.0.117", features = ["full", "visit"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "schemars"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
